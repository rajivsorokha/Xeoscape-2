[package]
name = "xeoscape"
version = "2.1.0"
description = "Xeoscape"
authors = ["Xeoscape"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["devtools"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "xeoscape"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
